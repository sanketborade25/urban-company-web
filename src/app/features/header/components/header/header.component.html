<header class="header">
  <div class="header-container">
    <!-- Logo -->
    <div class="header-logo">
      <h1 class="logo-text">UrbanClone</h1>
    </div>

    <!-- Middle: Search & City Selector -->
    <div class="header-center">
      <div class="city-selector">
        <span class="city-icon">📍</span>
        <select class="city-dropdown" aria-label="Select your city">
          <option>Select your city</option>
          <option>New York</option>
          <option>Los Angeles</option>
          <option>Chicago</option>
          <option>Houston</option>
          <option>Phoenix</option>
        </select>
      </div>

      <input
        type="text"
        class="search-input"
        placeholder="Search for services (cleaning, plumber, AC repair…)"
        aria-label="Search for services"
      />
    </div>

    <!-- Right: Actions -->
    <div class="header-actions">
      <button class="btn-text">Login</button>
      <button class="btn-primary">Sign up</button>
      <a href="#" class="link-professional">Become a professional</a>
    </div>
  </div>
</header>
